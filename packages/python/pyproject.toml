[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zclaudia-gateway"
version = "0.3.0"
description = "Python Backend SDK for the zclaudia gateway (Gateway Protocol v4): registration, lease heartbeats, channels, topics, and HTTP-over-channel serving."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["gateway", "websocket", "reverse-tunnel", "backend", "zclaudia"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = ["websockets>=15"]

[project.urls]
Repository = "https://github.com/zclaudia/zclaudia-gateway"
Issues = "https://github.com/zclaudia/zclaudia-gateway/issues"

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zclaudia_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC109"]  # test helpers intentionally take timeout parameters

[tool.mypy]
python_version = "3.11"
files = ["src/zclaudia_gateway"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
