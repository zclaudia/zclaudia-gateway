services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    ports:
      # Loopback by default: TLS terminates at the front proxy (ADR-0001) and
      # trustProxy must never face the open internet. Set GATEWAY_BIND=0.0.0.0
      # only for proxy-less setups.
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-3200}:${GATEWAY_PORT:-3200}"
    environment:
      - GATEWAY_SECRET=${GATEWAY_SECRET:?Please set GATEWAY_SECRET in .env}
      - GATEWAY_PORT=${GATEWAY_PORT:-3200}
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN:-}
      - GATEWAY_TRUST_PROXY=${GATEWAY_TRUST_PROXY:-false}
      - GATEWAY_ALLOWED_ORIGINS=${GATEWAY_ALLOWED_ORIGINS:-}
      - NTFY_ENABLED=${NTFY_ENABLED:-false}
      - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_AUTH_MODE=${NTFY_AUTH_MODE:-none}
      - NTFY_PUBLISH_TOKEN=${NTFY_PUBLISH_TOKEN:-}
      - NTFY_SUBSCRIBE_TOKEN=${NTFY_SUBSCRIBE_TOKEN:-}
      - NTFY_USERNAME=${NTFY_USERNAME:-}
      - NTFY_PASSWORD=${NTFY_PASSWORD:-}
      - NTFY_NOTIFY_PERMISSION_REQUEST=${NTFY_NOTIFY_PERMISSION_REQUEST:-true}
      - NTFY_NOTIFY_PROMPT_REQUEST=${NTFY_NOTIFY_PROMPT_REQUEST:-true}
      - NTFY_NOTIFY_RUN_COMPLETED=${NTFY_NOTIFY_RUN_COMPLETED:-true}
      - NTFY_NOTIFY_RUN_FAILED=${NTFY_NOTIFY_RUN_FAILED:-true}
      - NTFY_NOTIFY_BACKGROUND_PERMISSION=${NTFY_NOTIFY_BACKGROUND_PERMISSION:-true}
      - NTFY_NOTIFY_PROCESS_LEAK=${NTFY_NOTIFY_PROCESS_LEAK:-true}
    volumes:
      - gateway-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:${GATEWAY_PORT:-3200}/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gateway-data:
