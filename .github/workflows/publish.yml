# 发布流程:
#   自动:包内 bump version → 提交 → 推送 `gateway-<package>-v<版本>` tag;
#   手动:Actions 页面选择 Publish → 选择包运行(发布其 package.json 的当前版本,
#         建议在 main 上触发)。
# 两种方式都会先跑完整 lint/build/test 再发布对应 npm 包。
# 需要在仓库 Secrets 配置 NPM_TOKEN(npmjs.com granular token,
# 勾选 @zclaudia/gateway-protocol / -client / -backend 的读写权限)。
name: Publish

on:
  push:
    tags:
      - 'gateway-protocol-v*'
      - 'gateway-client-v*'
      - 'gateway-backend-v*'
  workflow_dispatch:
    inputs:
      package:
        description: '要发布的包(取该包 package.json 的当前版本)'
        type: choice
        required: true
        default: gateway-protocol
        options:
          - gateway-protocol
          - gateway-client
          - gateway-backend

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve package
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          DISPATCH_PKG: ${{ inputs.package }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            pkg="$DISPATCH_PKG"
          else
            pkg="${TAG%-v*}"
          fi
          case "$pkg" in
            gateway-protocol) dir=packages/protocol ;;
            gateway-client)   dir=packages/client ;;
            gateway-backend)  dir=packages/backend ;;
            *) echo "::error::Unknown package: $pkg"; exit 1 ;;
          esac
          manifest_version=$(node -p "require('./$dir/package.json').version")
          # tag 触发时校验 tag 与 manifest 一致,防止版本漂移
          if [ "$EVENT" != "workflow_dispatch" ]; then
            version="${TAG##*-v}"
            if [ "$manifest_version" != "$version" ]; then
              echo "::error::Tag $TAG claims $pkg@$version, but $dir/package.json is $manifest_version"
              exit 1
            fi
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Releasing $pkg@$manifest_version ($dir)"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm test

      - name: Publish
        working-directory: ${{ steps.meta.outputs.dir }}
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
